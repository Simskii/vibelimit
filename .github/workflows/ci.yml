name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run tests
        run: |
          xcodebuild \
            -project Vibelimit.xcodeproj \
            -scheme Vibelimit \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            test
